<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { overflow: hidden; background: #111; font-family: sans-serif; color: #fff; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .scr { position: absolute; inset: 0; background: #121620; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; z-index: 10; }
  .hid { display: none !important; }
  .btn { background: #ff9800; border: none; color: #fff; padding: 12px 24px; font-size: 18px; font-weight: bold; border-radius: 8px; }
  .row { display: flex; gap: 10px; align-items: center; font-size: 16px; }
  select, input { background: #222; color: #fff; padding: 6px; border-radius: 6px; border: 1px solid #555; }
  #hud { position: absolute; top: 10px; left: 15px; right: 15px; display: flex; justify-content: space-between; pointer-events: none; font-size: 18px; font-weight: bold; }
  #menuBtn { pointer-events: auto; background: #333; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; }
</style>
</head>
<body>

<div id="menu" class="scr">
  <h1 style="color:#ff9800">STRIKE 2D</h1>
  <div class="row">Карта: <select id="map"><option value="dust">Пустыня</option><option value="hangar">Ангар</option><option value="cyber">Неон</option></select></div>
  <div class="row">Скин: <select id="skin"><option value="std">Сталь</option><option value="gold">Золото</option><option value="asim">Азимов</option><option value="neon">Киберпанк</option></select></div>
  <div class="row">Ботов: <select id="bots"><option value="3">3</option><option value="5" selected>5</option><option value="8">8</option></select></div>
  <div class="row">Джойстик: <input type="range" id="jsize" min="40" max="80" value="55"></div>
  <div class="row">Тени (Графика): <input type="checkbox" id="shd" checked></div>
  <button class="btn" onclick="start()">ИГРАТЬ</button>
</div>

<div id="hud" class="hid">
  <div>HP: <span id="hp">100</span> | Счёт: <span id="sc">0</span></div>
  <button id="menuBtn" onclick="stop()">МЕНЮ</button>
</div>

<canvas id="c"></canvas>
<script src="game.js"></script>
</body>
  </html>
