<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { overflow: hidden; background: #141824; font-family: sans-serif; color: #fff; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .scr { position: absolute; inset: 0; background: #141824; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; z-index: 10; }
  .hid { display: none !important; }
  .btn { background: #00c853; border: none; color: #fff; padding: 14px 32px; font-size: 20px; font-weight: bold; border-radius: 10px; }
  select, input[type="text"] { background: #262e42; color: #fff; padding: 8px 12px; border-radius: 8px; border: 1px solid #445170; font-size: 16px; user-select: text; -webkit-user-select: text; }
  .card { background: #1d2436; padding: 10px 18px; border-radius: 10px; border: 1px solid #35415e; text-align: center; }
  #hud { position: absolute; top: 12px; left: 15px; right: 15px; display: flex; justify-content: space-between; font-size: 17px; font-weight: bold; z-index: 5; pointer-events: none; text-shadow: 1px 1px 2px #000; }
  #mBtn { pointer-events: auto; background: rgba(0,0,0,0.6); color: #fff; border: 1px solid #666; padding: 6px 14px; border-radius: 8px; }
  .pad { position: absolute; width: 62px; height: 62px; background: rgba(255,255,255,0.25); border: 2px solid rgba(255,255,255,0.5); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; z-index: 6; }
  .pad:active { background: rgba(255,255,255,0.55); }
  #jumpBtn { position: absolute; right: 25px; bottom: 25px; width: 85px; height: 85px; background: rgba(0,230,118,0.4); border: 2px solid #00e676; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: bold; z-index: 6; }
</style>
</head>
<body>

<div id="menu" class="scr">
  <h1 style="color:#00e676;">3D OBBY: 1-Е ЛИЦО</h1>
  <div class="card">
    <div>Профиль: <input type="text" id="nick" placeholder="Введи ник" maxlength="14" oninput="saveProf()"></div>
    <div style="margin-top:6px; color:#ffd700;">Побед (Матчей): <span id="winsTxt">0</span></div>
  </div>
  <div>Перчатки: <select id="skin"></select></div>
  <div>Поворот камеры: <input type="range" id="sens" min="2" max="10" value="5"></div>
  <button class="btn" onclick="start()">ИГРАТЬ</button>
</div>

<div id="hud" class="hid">
  <div><span id="hudNick">Игрок</span> | Этап: <span id="st">1</span> | Смертей: <span id="dt">0</span></div>
  <button id="mBtn" onclick="stop()">МЕНЮ</button>
</div>

<div id="ctrls" class="hid">
  <div id="bF" class="pad" style="left:82px; bottom:155px;">▲</div>
  <div id="bB" class="pad" style="left:82px; bottom:20px;">▼</div>
  <div id="bL" class="pad" style="left:15px; bottom:88px;">◀</div>
  <div id="bR" class="pad" style="left:149px; bottom:88px;">▶</div>
  <div id="jumpBtn">ПРЫГ</div>
</div>

<canvas id="c"></canvas>
<script src="game.js"></script>
</body>
</html>
